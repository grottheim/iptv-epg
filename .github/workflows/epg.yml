name: Bygg EPG

on:
  schedule:
    - cron: "0 3,15 * * *"   # 05:00 och 17:00 svensk sommartid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build_epg.py
      - name: Spara ny EPG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/epg.xml.gz
          git diff --cached --quiet || git commit -m "Uppdatera EPG" && git push
